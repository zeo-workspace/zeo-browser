# Security updates are enabled in the repository settings (2026-10-17); this
# file adds version updates, which nothing ran here before. Each PR is checked
# by .github/workflows/pr.yml (typecheck, unit tests, lockfile audit); the full
# suite runs locally with scripts/ci-vm.sh.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR per week for every minor/patch bump; majors stay separate so a
    # breaking change is never reviewed inside a routine batch.
    groups:
      minor:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 7 is the native port and exposes no compiler API, so
      # typescript-eslint cannot support it (peer stays typescript <6.1.0).
      # Drop this once typescript-eslint/typescript-eslint#10940 closes.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # Release cooldown: don't adopt a version published <7 days ago
    # (mitigates freshly-compromised releases). It holds back DIRECT
    # dependencies only; transitive versions the resolver pulls into the
    # lockfile are not gated by it.
    cooldown:
      default-days: 7
  # The workflow's actions are pinned by commit SHA; this keeps those pins
  # current (story 068).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
